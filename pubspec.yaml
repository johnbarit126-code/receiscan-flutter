name: receiscan
description: Receipt scanning and management app with OCR and Firebase
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0
  google_mlkit_text_recognition: ^0.8.0
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  image: ^4.0.17
  path_provider: ^2.1.1
  intl: ^0.19.0
  provider: ^6.0.0
  cached_network_image: ^3.3.0
  lottie: ^2.4.0
  fl_chart: ^0.65.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
